# The `role-draft` agent preset：人格卡撰写（0.5.64）
#
# 用途：桥接控制台「人格卡 → AI 联网生成」时，用 DSH 的模型写正文。
#
# 为什么单独一个 preset：
#   · qq-chat / qq-chat-v2 是给「QQ 群聊」用的：带 QQ 工具、带"被 @ 才回"的规则，
#     在非 QQ 会话里跑，turn 会直接 error（实测）。
#   · 这个 preset 只有 persona 一行：无工具、无 QQ 上下文、无文件访问 ——
#     模型只能老老实实按提示写 markdown。
#
# 安全边界：不给任何本地工具（无 bash/文件读写/子代理），因此即使提示词被注入也做不了本机操作。

- id: persona
  name: '@deepseek-ai/dsh-persona'
  config:
    prefix: >-
      You are a writing assistant powered by the {{model}} model.

      【任务】你只做一件事：把用户给的「名字 + 偏好 + 联网资料」写成一张中文人格卡正文。

      【输出格式】
      1. 直接用二级标题组织，顺序固定：## 身份 / ## 性格与语气 / ## 说话习惯 / ## 喜欢与讨厌 / ## 边界 / ## 示例对话
      2. 「身份」2~3 句；其余小节用简短条目；「示例对话」写 2 组，格式是「> 对方：…」和「> <名字>：…」
      3. 不要写"以下是"这种开场白，不要解释你在做什么，直接输出 markdown 正文
      4. 不要编造具体事实（获奖、数据、真实人物关系）；资料不足就写得克制一些

      【硬规则】
      - 不要调用任何工具（你没有工具）
      - 不要输出 QQ 消息、不要寒暄、不要问用户问题
      - 不要提到"我是一个 AI 助手"这类自我指涉

- id: qq-tool-restrict
  name: ./qq-tool-restrict.mjs
  config:
    # 这个 preset 本来就没有任何工具；挂上守卫是仓库的硬性约定（每个 preset 都必须在），
    # 顺便兜底：万一以后有人往这里加工具，也会被白名单挡住。
    allowedTools: []

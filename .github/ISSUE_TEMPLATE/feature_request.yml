name: 功能建议
description: 想要某个能力，或对现有行为有改进想法
title: "[feature] "
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: 你想解决什么问题
      description: 描述场景，不要只写"希望支持 X"
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: 你设想的做法（可选）
  - type: textarea
    id: alternatives
    attributes:
      label: 你考虑过的替代方案
      description: 包括"不改，用现有功能凑合"的做法
  - type: dropdown
    id: scope
    attributes:
      label: 影响范围
      options:
        - 只加文档
        - 新工具 / 新能力
        - 改变现有行为（可能破坏兼容）
        - 性能 / 稳定性
        - 不确定
  - type: checkboxes
    id: ack
    attributes:
      label: 确认
      options:
        - label: 我知道这是个人项目，没有 SLO
          required: true
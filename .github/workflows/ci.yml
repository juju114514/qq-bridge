name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  syntax:
    name: 语法检查（node --check）
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: [22.x, 24.x]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}

      - name: 逐个文件做语法检查
        run: |
          set -e
          fail=0
          while IFS= read -r f; do
            if ! node --check "$f"; then
              echo "::error file=$f::语法检查失败"
              fail=1
            fi
          done < <(find src scripts -type f \( -name '*.js' -o -name '*.mjs' \) | sort)
          exit $fail

      - name: 校验 config.example.json 是合法 JSON
        run: node -e "JSON.parse(require('fs').readFileSync('config.example.json','utf8')); console.log('config.example.json OK')"

      - name: 校验 package.json
        run: node -e "const p=require('./package.json'); if(!p.name||!p.version) process.exit(1); console.log(p.name, p.version)"

  deploy-scripts:
    name: 部署脚本（deploy/*.sh，真 bash）
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22.x

      # 为什么单独一个 job、而且是真 Linux：
      # deploy/*.sh 的问题从来不是 node 语法，而是「装完跑不通」——
      # 降权到 qqbridge 后读不到 $DSH_HOME/.credentials.yaml、npm 丢 HOME 写 /root 之类。
      # 这些只有在有 bash 的环境里才验得动，所以在这里跑 bash -n + 纯逻辑自测。
      - name: 部署脚本回归（语法 + 凭据/权限/占位逻辑）
        run: node scripts/test-deploy-scripts.mjs

  secrets:
    name: 敏感信息扫描
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: 禁止出现真实账号 / 令牌 / Cookie
        run: |
          set -e
          # 真实 QQ 号（9-10 位且不是占位符 123456789 / 987654321 之类）
          bad=0
          if grep -rInE '(sk-[A-Za-z0-9]{24,}|gho_[A-Za-z0-9]{30,}|MUSIC_U=[A-Za-z0-9%._-]{20,})' \
               --include='*.js' --include='*.mjs' --include='*.json' --include='*.md' . ; then
            echo "::error::发现疑似真实令牌/密钥"
            bad=1
          fi
          if grep -rInE '"accessToken"\s*:\s*"[A-Za-z0-9]{20,}"' --include='*.json' . ; then
            echo "::error::config 里出现真实 accessToken"
            bad=1
          fi
          exit $bad

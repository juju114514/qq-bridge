name: audit

# 为什么要有这条 CI：
#   这套审计是"clone 即全绿"的承诺。但历史上有 6 处测试写死了作者本机路径
#   （D:/QQBot-open/qq-bridge），在 Windows 本机全绿、在 Linux / 别的目录立刻红。
#   所以至少要在 Linux 上跑一遍 —— 这是唯一能持续证明"换机器也能过"的办法。
#
# 2026-10-31 修正：这条 workflow 从上线起就一直红（最近 10 次全 failure），
#   原因是漏了 `npm ci` —— 审计里有些测试需要 js-yaml / zod /
#   @modelcontextprotocol/sdk / @deepseek-ai/schemastery。那是**测试依赖**，
#   不是运行时依赖，所以"仓库没有运行时 npm 依赖"这句话没错，但也不能跳过安装。

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: 安装依赖（测试依赖，不是运行时依赖）
        run: npm ci --no-audit --no-fund

      - name: 审计全套
        run: node scripts/test-audit.mjs

      - name: 可移植性（硬编码路径 / 绝对路径加载）
        run: node scripts/test-portability.mjs
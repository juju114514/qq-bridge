<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>大肥鱼 · 直播画面</title>
<style>
  :root { --fg:#eaf1ff; --dim:#9fb0cf; }
  * { box-sizing: border-box; }
  html, body { margin:0; height:100%; overflow:hidden; background:#0a0714;
    font-family: system-ui, "Microsoft YaHei", sans-serif; color:var(--fg); }
  /* 星空背景 */
  .sky { position:fixed; inset:0; background:
      radial-gradient(1200px 700px at 20% 15%, #2a1a4a 0%, #120a22 45%, #07040f 100%);
    z-index:0; }
  .stars { position:fixed; inset:0; z-index:1; opacity:.55;
    background-image: radial-gradient(2px 2px at 20px 30px, #fff6, transparent),
      radial-gradient(1px 1px at 120px 80px, #fff8, transparent),
      radial-gradient(1.6px 1.6px at 220px 160px, #fff5, transparent),
      radial-gradient(1px 1px at 320px 60px, #fff7, transparent);
    background-size: 420px 240px; }
  .stage { position:fixed; inset:0; z-index:2; display:flex; align-items:flex-end; justify-content:center; }
  .char { position:relative; height:min(66vh, 66vw); aspect-ratio:1/1; bottom:-6vh; }
  .char img { position:absolute; display:block; pointer-events:none; -webkit-user-drag:none; }
  /* 字幕 */
  .sub { position:fixed; left:50%; bottom:8vh; transform:translateX(-50%);
    max-width:72vw; padding:12px 22px; border-radius:14px; font-size:26px; line-height:1.45;
    background:rgba(10,8,22,.72); border:1px solid rgba(150,130,255,.35);
    text-align:center; opacity:0; transition:opacity .25s; z-index:5; }
  .sub.show { opacity:1; }
  /* 气泡 */
  .bubble { position:fixed; right:9vw; top:16vh; max-width:26vw; padding:14px 18px;
    border-radius:16px; font-size:20px; line-height:1.5; background:rgba(18,14,34,.85);
    border:1px solid rgba(150,130,255,.4); opacity:0; transform:translateY(6px);
    transition:opacity .25s, transform .25s; z-index:6; }
  .bubble.show { opacity:1; transform:translateY(0); }
  /* 弹幕轨道 */
  .danmu-layer { position:fixed; inset:0; z-index:4; pointer-events:none; overflow:hidden; }
  .danmu { position:absolute; white-space:nowrap; font-size:22px; padding:6px 14px;
    border-radius:999px; background:rgba(12,10,24,.55); border:1px solid rgba(150,130,255,.28);
    animation: dm 9s linear forwards; }
  @keyframes dm { from { transform: translateX(0); } to { transform: translateX(-140vw); } }

  /* 左下角正在播放 */
  .now { position:fixed; left:28px; bottom:26px; z-index:7; font-size:15px; color:var(--dim);
    background:rgba(10,8,22,.6); padding:10px 16px; border-radius:12px;
    border:1px solid rgba(150,130,255,.25); min-width:260px; }
  .now b { color:#c9b6ff; font-weight:600; }
  .badge { display:inline-block; width:8px; height:8px; border-radius:50%; background:#6ee7a8; margin-right:8px; }
  .badge.pause { background:#ffb86b; }
</style>
</head>
<body>
<div class="sky"></div>
<div class="stars"></div>

<div class="stage">
  <div class="char" id="char">
    <img id="face" src="assets/layers/face.png" style="left:0;top:0;width:100%;height:100%" />
  </div>
</div>

<div class="danmu-layer" id="danmu"></div>
<div class="sub" id="sub"></div>
<div class="bubble" id="bubble"></div>

<div id="tapStart" style="position:fixed;inset:0;z-index:20;display:flex;align-items:center;
    justify-content:center;background:rgba(6,4,12,.55);cursor:pointer;font-size:22px;color:#e8ecff">
    点一下画面开始（浏览器自动播放限制；OBS 里给浏览器源加 --autoplay-policy=no-user-gesture-required）
  </div>
  <div class="now" id="now"><span class="badge pause" id="dot"></span><span id="nowText">背景音乐：未播放</span></div>

<script>
const q = (s) => document.querySelector(s);
const sub = q('#sub'), bubble = q('#bubble'), nowText = q('#nowText'), dot = q('#dot');
const CANVAS = 1254;
let eyes = [], mouths = [];
let mouthT = 0, blinkT = 0, nextBlink = 2000;

// ---------- 图层 ----------
function place(img, box) {
  img.style.left = (box[0] / CANVAS * 100) + '%';
  img.style.top = (box[1] / CANVAS * 100) + '%';
  img.style.width = (box[2] / CANVAS * 100) + '%';
  img.style.height = (box[3] / CANVAS * 100) + '%';
  const m = 'radial-gradient(ellipse 78% 78% at 50% 50%, #000 62%, transparent 100%)';
  img.style.webkitMaskImage = m; img.style.maskImage = m;
  q('#char').appendChild(img);
}
async function initLayers() {
  let meta = { eyes: [[450,470,185,165],[665,470,185,165]], mouth: [630,620,95,62] };
  try { meta = await (await fetch('assets/layers/layers.json')).json(); } catch (e) {}
  const [e1, e2] = meta.eyes, m = meta.mouth;
  const mk = (src) => { const i = new Image(); i.src = src; return i; };
  const el = mk('assets/layers/eye1_closed.png'), er = mk('assets/layers/eye2_closed.png');
  const ol = mk('assets/layers/eye1_open.png'), orr = mk('assets/layers/eye2_open.png');
  const mc = mk('assets/layers/mouth_closed.png'), mo = mk('assets/layers/mouth_open.png');
  place(el, e1); place(er, e2); place(ol, e1); place(orr, e2); place(mc, m); place(mo, m);
  el.style.opacity = 0; er.style.opacity = 0; mo.style.opacity = 0;
  eyes = [ol, orr, el, er]; mouths = [mc, mo];
}

// ---------- 音频：音乐 + 语音 + 闪避 ----------
const music = new Audio();
music.loop = false;
let musicGain = 0.55;
let ctx = null, voiceEl = null, analyser = null, speaking = false;
let songs = [], songIdx = 0, mode = 'seq';

function ensureVoice() {
  if (ctx) return;
  voiceEl = new Audio();
  voiceEl.crossOrigin = 'anonymous';
  ctx = new (window.AudioContext || window.webkitAudioContext)();
  analyser = ctx.createAnalyser();
  analyser.fftSize = 1024;
  const src = ctx.createMediaElementSource(voiceEl);
  src.connect(analyser); analyser.connect(ctx.destination);
}

// 闪避：说话 0.3 秒压到 25%，说完 0.8 秒回 100%
let duck = 0, duckTarget = 0;
function duckLoop() {
  const k = duckTarget > duck ? 0.22 : 0.055;   // 下压快、回升慢
  duck += (duckTarget - duck) * k;
  music.volume = Math.max(0, Math.min(1, musicGain * (1 - duck * 0.75)));
  requestAnimationFrame(duckLoop);
}
duckLoop();

function playSong(i) {
  if (!songs.length) { nowText.textContent = '背景音乐：歌单为空（放 mp3 到 room-pet/music）'; return; }
  songIdx = (i + songs.length) % songs.length;
  music.src = '/music/file?name=' + encodeURIComponent(songs[songIdx]);
  music.volume = musicGain;
  music.play().then(() => {
    dot.className = 'badge';
    nowText.innerHTML = '背景音乐：<b>' + songs[songIdx].replace(/\.[^.]+$/, '') + '</b>';
  }).catch(() => { nowText.textContent = '背景音乐：播放被浏览器拦截（点一下画面）'; });
}
music.addEventListener('ended', () => {
  if (mode === 'one') { music.play(); return; }
  if (mode === 'random') playSong(Math.floor(Math.random() * songs.length));
  else playSong(songIdx + 1);
});

async function speak(text) {
  if (!text) return;
  ensureVoice();
  showSub(text);
  try {
    const r = await fetch('/tts?stream=1&text=' + encodeURIComponent(text));
    if (!r.ok) { hideSubSoon(); return; }
    voiceEl.src = URL.createObjectURL(await r.blob());
    await ctx.resume();
    speaking = true; duckTarget = 1;
    voiceEl.onended = () => { speaking = false; duckTarget = 0; hideSubSoon(); };
    await voiceEl.play();
  } catch (e) { speaking = false; duckTarget = 0; hideSubSoon(); }
}
let subTimer = null;
function showSub(t) { sub.textContent = t; sub.classList.add('show'); clearTimeout(subTimer); }
function hideSubSoon() { subTimer = setTimeout(() => sub.classList.remove('show'), 1400); }
function sayBubble(t, ms = 6000) {
  bubble.textContent = t; bubble.classList.add('show');
  setTimeout(() => bubble.classList.remove('show'), ms);
}

// ---------- 口型 ----------
function loop(now) {
  if (now > nextBlink) {
    const t = (now - nextBlink) / 200;
    if (t < 0.5) blinkT = t * 2;
    else if (t < 1) blinkT = 1 - (t - 0.5) * 2;
    else { blinkT = 0; nextBlink = now + 2200 + Math.random() * 3500; }
  }
  let target = 0;
  if (speaking && analyser) {
    const buf = new Float32Array(analyser.fftSize);
    analyser.getFloatTimeDomainData(buf);
    let sum = 0; for (const v of buf) sum += v * v;
    const rms = Math.sqrt(sum / buf.length);
    target = Math.min(1, Math.max(0, (rms - 0.008) * 7));
  }
  mouthT += (target - mouthT) * (target > mouthT ? 0.6 : 0.12);
  if (mouthT < 0.02) mouthT = 0;
  if (eyes.length) {
    eyes[0].style.opacity = String(1 - blinkT); eyes[1].style.opacity = String(1 - blinkT);
    eyes[2].style.opacity = String(blinkT); eyes[3].style.opacity = String(blinkT);
    mouths[0].style.opacity = String(1 - mouthT);
    mouths[1].style.opacity = String(Math.min(1, mouthT * 1.4));
  }
  requestAnimationFrame(loop);
}

// ---------- 拉状态（中控写的）----------
let lastSaySeq = 0;
async function poll() {
  try {
    const s = await (await fetch('/stream/state')).json();
    songs = s.songs || [];
    if (s.volume != null && Math.abs(s.volume - musicGain) > 0.01) { musicGain = s.volume; if (!speaking) music.volume = musicGain; }
    mode = s.mode || 'seq';
    if (s.playing && music.paused && songs.length) playSong(songIdx);
    if (!s.playing && !music.paused) { music.pause(); dot.className = 'badge pause'; nowText.textContent = '背景音乐：已暂停'; }
    if (s.saySeq && s.saySeq !== lastSaySeq) {
      lastSaySeq = s.saySeq;
      speak(s.sayText);
      sayBubble(s.sayText);
    }
  } catch (e) {}
  setTimeout(poll, 1000);
}


// ---------- 抖音弹幕 ----------
let lastLiveSeq = 0;
const lanes = [12, 16, 20, 24];
function spawnDanmu(user, text) {
  const layer = document.getElementById('danmu');
  if (!layer) return;
  const el = document.createElement('div');
  el.className = 'danmu';
  el.textContent = (user ? user + '：' : '') + text;
  const lane = lanes[Math.floor(Math.random() * lanes.length)];
  el.style.top = lane + 'vh';
  el.style.left = '100vw';
  const dur = 8 + Math.random() * 4;
  el.style.animationDuration = dur + 's';
  layer.appendChild(el);
  setTimeout(() => el.remove(), (dur + 1) * 1000);
}

async function pollLive() {
  try {
    const d = await (await fetch('/live/recent?limit=40')).json();
    for (const it of d.items || []) {
      if (it.seq > lastLiveSeq) {
        lastLiveSeq = it.seq;
        spawnDanmu(it.user, it.text);
      }
    }
    if (!lastLiveSeq && d.seq) lastLiveSeq = d.seq;
  } catch (e) {}
  setTimeout(pollLive, 1500);
}

initLayers().then(() => { requestAnimationFrame(loop); poll(); pollLive(); });
document.getElementById('tapStart').addEventListener('click', async (e) => {
  e.currentTarget.style.display = 'none';
  if (ctx) await ctx.resume();
  try {
    const st = await (await fetch('/stream/state')).json();
    songs = st.songs || [];
    if (st.mode) mode = st.mode;
    if (st.volume != null) musicGain = st.volume;
    if (st.playing && songs.length) playSong(0);
  } catch (_) {}
  poll();
});
</script>
</body>
</html>

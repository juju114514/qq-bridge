# qq-bridge —— 官方通道用（Linux）
#
#   docker compose up -d
#
# 能力边界（重要）：
#   ✅ 官方机器人通道（q.qq.com）：收群 @ / 单聊、被动回复、主动消息、互动召回
#   ❌ 个人号通道（SnowLuma）—— 需要扫码登录 QQ，请留在宿主机跑，
#      然后在 config.json 里把 snowluma.wsUrl/httpUrl 指到宿主机（或 host.docker.internal）
#
# 首次启动后要做的：
#   1) 把 AppID / AppSecret 写进 ./state/official.json
#   2) 把机器人 openid 白名单写进 config.json 的 official.allow
#   3) 群主给机器人开「主动推送消息」+「接收群内全部消息」（要用主动消息/全量才需要）

services:
  qq-bridge:
    build: .
    image: qq-bridge:latest
    container_name: qq-bridge
    restart: unless-stopped
    ports:
      - "127.0.0.1:3101:3101"   # 容器独立端口（宿主机桥接用 3100），只绑回环
    volumes:
      # 容器用独立 state：两套实例绝不能共用一个 state（否则队列/令牌互相覆盖）
      - ./state-docker:/app/state
      - ./config.json:/app/config.json
    environment:
      - TZ=Asia/Shanghai
      # 容器内必须绑 0.0.0.0，否则宿主机端口映射进不来（宿主机侧仍只映射到 127.0.0.1）
      - QQB_CONSOLE_HOST=0.0.0.0
      # 实例隔离：容器是独立实例，state 与端口都用自己的一套，不跟宿主机抢
      - QQB_INSTANCE=docker
      - QQB_CONSOLE_PORT=3101
    # 桥接进程本身很轻，但要跑 ffmpeg 抽帧/转码
    deploy:
      resources:
        limits:
          memory: 1g
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
